steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/grouplang-450317/vibe-kanban/vibe-kanban-backend', '.', '--build-arg', 'RUST_VERSION=1.88']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/grouplang-450317/vibe-kanban/vibe-kanban-backend']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'vibe-kanban-backend'
    - '--image'
    - 'us-central1-docker.pkg.dev/grouplang-450317/vibe-kanban/vibe-kanban-backend'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--port'
    - '8080'
    - '--memory'
    - '1Gi'
    - '--cpu'
    - '1'
    - '--set-env-vars'
    - 'PORT=8080,DATABASE_URL=/app/data/db.sqlite,RUST_LOG=info'

images:
  - 'us-central1-docker.pkg.dev/grouplang-450317/vibe-kanban/vibe-kanban-backend'